[package]
name = "mariadb-manager"
version = "0.1.0"
edition = "2021"
description = "Schlanker, schneller MariaDB-Navigator im Stil von Navicat 8"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37", default-features = false }
mysql = { version = "28", default-features = false, features = ["minimal-rust", "buffer-pool", "rustls-tls-ring", "client_ed25519", "client_parsec"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
blowfish = "0.9"
sha1 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico", "tiff"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "0.15", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
